name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: C++ engine matches the TypeScript engine
        run: |
          npm run fixtures
          g++ -std=c++17 -O1 -Wall -Wextra native/Tests/parity.cpp native/Source/Core.cpp -o parity
          ./parity native/Tests/fixtures.txt
